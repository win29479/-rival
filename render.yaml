services:
  - type: web
    name: math-rivals-3d-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        value: "*"
